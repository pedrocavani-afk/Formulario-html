<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Escola de Programação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>Escola de Programação</h1>
            <p>Faça sua inscrição e comece a aprender programação.</p>
        </header>

        <form action="/cadastro" method="post">

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="2">

                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required minlength="2">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite uma senha com pelo menos 8 caracteres" required minlength="8">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="14" max="100" placeholder="Digite sua idade" required>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>

            </fieldset>

            <fieldset>
                <legend>Informações do curso</legend>

                <label for="curso">Escolha o curso:</label>
                <select id="curso" name="curso" required>
                    <option value="">Selecione um curso</option>
                    <option value="html-css">HTML e CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="banco-dados">Banco de Dados</option>
                </select>

                <p>Modalidade:</p>

                <div class="opcoes">
                    <div>
                        <input type="radio" id="presencial" name="modalidade" value="presencial" required>
                        <label for="presencial">Presencial</label>
                    </div>

                    <div>
                        <input type="radio" id="online" name="modalidade" value="online">
                        <label for="online">Online</label>
                    </div>
                </div>

                <p>Turno:</p>

                <div class="opcoes">
                    <div>
                        <input type="radio" id="manha" name="turno" value="manha" required>
                        <label for="manha">Manhã</label>
                    </div>

                    <div>
                        <input type="radio" id="tarde" name="turno" value="tarde">
                        <label for="tarde">Tarde</label>
                    </div>

                    <div>
                        <input type="radio" id="noite" name="turno" value="noite">
                        <label for="noite">Noite</label>
                    </div>
                </div>

                <label for="nivel">Nível de conhecimento:</label>
                <select id="nivel" name="nivel" required>
                    <option value="">Selecione seu nível</option>
                    <option value="iniciante">Iniciante</option>
                    <option value="intermediario">Intermediário</option>
                    <option value="avancado">Avançado</option>
                </select>

            </fieldset>

            <fieldset>
                <legend>Conhecimentos</legend>

                <p>Quais tecnologias você já conhece?</p>

                <div class="tecnologias">

                    <div class="tecnologia">
                        <input type="checkbox" id="html" name="tecnologias" value="html">
                        <label for="html">HTML</label>
                    </div>

                    <div class="tecnologia">
                        <input type="checkbox" id="css" name="tecnologias" value="css">
                        <label for="css">CSS</label>
                    </div>

                    <div class="tecnologia">
                        <input type="checkbox" id="javascript" name="tecnologias" value="javascript">
                        <label for="javascript">JavaScript</label>
                    </div>

                    <div class="tecnologia">
                        <input type="checkbox" id="python" name="tecnologias" value="python">
                        <label for="python">Python</label>
                    </div>

                    <div class="tecnologia">
                        <input type="checkbox" id="java" name="tecnologias" value="java">
                        <label for="java">Java</label>
                    </div>

                    <div class="tecnologia">
                        <input type="checkbox" id="csharp" name="tecnologias" value="csharp">
                        <label for="csharp">C#</label>
                    </div>

                </div>

            </fieldset>

            <fieldset>
                <legend>Localização</legend>

                <label for="estado">Estado:</label>
                <select id="estado" name="estado" required>
                    <option value="">Selecione seu estado</option>
                    <option value="sp">São Paulo</option>
                    <option value="mg">Minas Gerais</option>
                    <option value="rj">Rio de Janeiro</option>
                    <option value="pr">Paraná</option>
                    <option value="sc">Santa Catarina</option>
                    <option value="ba">Bahia</option>
                    <option value="go">Goiás</option>
                </select>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required minlength="2">

            </fieldset>

            <fieldset>
                <legend>Sobre o aluno</legend>

                <label for="mensagem">Por que você deseja fazer este curso?</label>

                <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva aqui o motivo pelo qual deseja fazer o curso..." required minlength="20" maxlength="500"></textarea>

                <small>Digite entre 20 e 500 caracteres.</small>

            </fieldset>

            <fieldset>
                <legend>Termos de inscrição</legend>

                <div class="termos">
                    <input type="checkbox" id="termos" name="termos" value="aceito" required>
                    <label for="termos">Aceito os termos de inscrição</label>
                </div>

            </fieldset>

            <div class="botoes">
                <button type="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </div>

        </form>

        <footer>
            <p>Escola de Programação © 2026</p>
        </footer>

    </main>

</body>
</html>
